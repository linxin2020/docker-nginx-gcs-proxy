services:
  nginx-gcs-proxy:
    image: ghcr.io/linxin2020/docker-nginx-gcs-proxy:latest
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8080}:8080"
    environment:
      LISTEN_PORT: "8080"
      CACHE_PATH: /var/cache/nginx-gcs-proxy
      CACHE_VALIDITY: "${CACHE_VALIDITY:-3M}"
      NOT_FOUND_MEANS_INDEX: "${NOT_FOUND_MEANS_INDEX:-false}"
    volumes:
      - nginx-gcs-cache:/var/cache/nginx-gcs-proxy

volumes:
  nginx-gcs-cache:
